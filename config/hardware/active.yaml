version: 1
robot_name: so_arm101
generated_files:
  ros2_control_xacro: so_arm101_ros2_control.xacro
  controllers_yaml: controllers.yaml
passive_urdf_joints: []
ignore_urdf_joints: []

cameras: []

firmware:
  source_dir: lucy_embedded_firmware
  build_dir: build/firmware

controller_manager:
  update_rate: 100

boards:
  rp2040_so_arm:
    serial_id: ''
    board_class: bus_servo_only
    host:
      firmware: linux
      device: SO-ARM
      usb:
        vid: 0x1a86
        pid: 0x55d3
    slave_address: 1
    internal_servo_slots: 6
    firmware_target: lucy_so_arm
    compile_definition: USE_SO_ARM
    topic_actuators: actuators/so_arm
    topic_sensors: sensors/so_arm
    controller:
      name: so_arm_controller
      type: joint_trajectory_controller/JointTrajectoryController

actuators:
  - id: rotation
    urdf_joint: Rotation
    board: rp2040_so_arm
    physical_pin: 1
    servo_type: '300'
    offset: 3.14159
    direction: 1
    scale: 1
    limit_min: 1.13668
    limit_max: 5.24468
    default: 3.14159
    enabled: true
  - id: pitch
    urdf_joint: Pitch
    board: rp2040_so_arm
    physical_pin: 2
    servo_type: '300'
    offset: 3.14159
    direction: 1
    scale: 1
    limit_min: 1.19497
    limit_max: 5.00385
    default: 3.14159
    enabled: true

  - id: elbow
    urdf_joint: Elbow
    board: rp2040_so_arm
    physical_pin: 3
    servo_type: '300'
    offset: 3.14159
    direction: 1
    scale: 1
    limit_min: 1.30849
    limit_max: 4.71852
    default: 3.14159
    enabled: true
  - id: wrist_pitch
    urdf_joint: Wrist_Pitch
    board: rp2040_so_arm
    physical_pin: 4
    servo_type: '300'
    offset: 3.14159
    direction: 1
    scale: 1
    limit_min: 1.35911
    limit_max: 4.95629
    default: 3.14159
    enabled: true
  - id: wrist_roll
    urdf_joint: Wrist_Roll
    board: rp2040_so_arm
    physical_pin: 5
    servo_type: '300'
    offset: 3.14159
    direction: 1
    scale: 1
    limit_min: 0
    limit_max: 6.28165
    default: 3.14159
    enabled: true
  - id: jaw
    urdf_joint: Jaw
    board: rp2040_so_arm
    physical_pin: 6
    servo_type: '300'
    offset: 3.14159
    direction: 1
    scale: 1
    limit_min: 3.12779
    limit_max: 5.39194
    default: 3.14159
    enabled: true

sensors:
  - id: rotation_encoder
    type: encoder
    associated_actuator: rotation
    board: rp2040_so_arm
    physical_pin: 1
    min_value: 1.13668
    max_value: 5.24468
    enabled: false
  - id: pitch_encoder
    type: encoder
    associated_actuator: pitch
    board: rp2040_so_arm
    physical_pin: 2
    min_value: 1.19497
    max_value: 5.00385
    enabled: false
  - id: elbow_encoder
    type: encoder
    associated_actuator: elbow
    board: rp2040_so_arm
    physical_pin: 3
    min_value: 1.30849
    max_value: 4.71852
    enabled: false

  - id: wrist_pitch_encoder
    type: encoder
    associated_actuator: wrist_pitch
    board: rp2040_so_arm
    physical_pin: 4
    min_value: 1.35911
    max_value: 4.95629
    enabled: false
  - id: wrist_roll_encoder
    type: encoder
    associated_actuator: wrist_roll
    board: rp2040_so_arm
    physical_pin: 5
    min_value: 0
    max_value: 6.28165
    enabled: false
  - id: jaw_encoder
    type: encoder
    associated_actuator: jaw
    board: rp2040_so_arm
    physical_pin: 6
    min_value: 3.12779
    max_value: 5.39194
    enabled: false
